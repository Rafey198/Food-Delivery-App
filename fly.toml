# Fly.io deployment for the FoodPilot API.
# Web is best deployed to Vercel (see apps/web/vercel.json).
app = "foodpilot-api"
primary_region = "iad"

[build]
  dockerfile = "docker/api.Dockerfile"

[env]
  NODE_ENV = "production"
  API_PORT = "8080"
  API_HOST = "0.0.0.0"
  AI_PROVIDER = "mock"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
